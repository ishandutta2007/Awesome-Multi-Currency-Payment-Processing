<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Mesh Gradient Highlights -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes currencyFloat1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes currencyFloat2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-3deg); }
    }
    .pulse-glow1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .pulse-glow2 {
      transform-origin: 1000px 260px;
      animation: pulseGlow 9s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashStream 3s linear infinite;
    }
    .badge-card-1 {
      animation: currencyFloat1 6s ease-in-out infinite;
    }
    .badge-card-2 {
      animation: currencyFloat2 7s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .particle-4 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows -->
  <circle cx="240" cy="110" r="220" fill="url(#glow1)" class="pulse-glow1" />
  <circle cx="980" cy="240" r="250" fill="url(#glow2)" class="pulse-glow2" />
  <circle cx="600" cy="180" r="280" fill="url(#glow3)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Connection / Settlement Flow Lines (Behind text layer) -->
  <g fill="none" opacity="0.35">
    <path d="M 80 180 C 260 80, 420 280, 600 180 C 780 80, 940 280, 1120 180" stroke="#38bdf8" stroke-width="2" class="flow-line" />
    <path d="M 120 280 C 300 220, 500 80, 700 240 C 900 360, 1050 140, 1140 100" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Ambient Dynamic Floating Currency Pills (Positioned on wings, well away from title center) -->
  <!-- Left Side Badges -->
  <g class="badge-card-1" transform="translate(60, 50)">
    <rect width="130" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">USD ⇄ EUR</text>
  </g>
  <g class="badge-card-2" transform="translate(50, 240)">
    <rect width="140" height="42" rx="21" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <text x="22" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399">GBP · JPY · CAD</text>
  </g>

  <!-- Right Side Badges -->
  <g class="badge-card-2" transform="translate(1010, 60)">
    <rect width="135" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <text x="22" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e879f9">135+ Currencies</text>
  </g>
  <g class="badge-card-1" transform="translate(1000, 250)">
    <rect width="145" height="42" rx="21" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.4" filter="url(#shadow)" />
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Real-time FX Rails</text>
  </g>

  <!-- Floating Sparkles / Particles -->
  <circle cx="280" cy="80" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="920" cy="90" r="3.5" fill="#c084fc" class="particle-2" />
  <circle cx="210" cy="290" r="2.5" fill="#34d399" class="particle-3" />
  <circle cx="940" cy="300" r="3" fill="#fbbf24" class="particle-4" />

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean view, high contrast, uncluttered) -->
  <!-- Top Category Tag -->
  <g transform="translate(450, 48)">
    <rect width="300" height="34" rx="17" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="150" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">GLOBAL FINTECH ARCHITECTURE</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
    Multi-Currency Payment Processing
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#f1f5f9" text-anchor="middle" letter-spacing="0.2">
    Enterprise Cross-Border Rails, FX Settlement &amp; Open-Source Orchestration
  </text>

  <!-- Feature Highlights / Meta Pills in Center Bottom -->
  <g transform="translate(300, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Global Gateways</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="230" cy="18" r="6" fill="#10b981" />
    <text x="246" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Multi-Asset FX</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="440" cy="18" r="6" fill="#c084fc" />
    <text x="456" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Open Engines</text>
  </g>
</svg>
